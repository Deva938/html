<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Praktikum CSS Lanjutan</title>
    <link rel="stylesheet" href="b1.css">
</head>
<body>

    <nav>
        <ul class="menu">
            <li><a href="#">Beranda</a></li>
            <li><a href="#">Profil</a></li>
            <li><a href="#">Artikel</a></li>
            <li><a href="#">Kontak</a></li>
        </ul>
    </nav>

    <main style="max-width: 600px; margin: 20px auto; font-family: sans-serif;">
        
        <h2>Judul Artikel Utama</h2>
        
        <p class="artikel">
            Pemrograman web lanjutan mengajarkan kita cara mempercantik tampilan halaman menggunakan kombinasi selektor, pseudo-class, hingga pseudo-element agar terlihat lebih interaktif dan profesional.
        </p>

        <div style="margin-top: 20px;">
            <label for="nama">Nama Lengkap:</label><br>
            <input type="text" id="nama" placeholder="Ketik nama Anda...">
        </div>

        <div style="margin-top: 20px;">
            <button class="tombol" style="padding: 10px 20px; background: #2980B9; color: white; border: none; border-radius: 4px; cursor: pointer;">
                Kirim Data
            </button>
        </div>

        <table style="width:150%; margin-top: 30px; border-collapse: collapse;">
            <tr><th>No</th><th>Nama Siswa</th></tr>
            <tr><td>1</td><td>Hasan</td></tr>
            <tr><td>2</td><td>Nicho</td></tr>
            <tr><td>3</td><td>Burhan</td></tr>
        </table>

    </main>

</body>
</html>
